<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ═══════════ ORGANIC DESIGN SYSTEM — design handoff, high fidelity ═══════════ */
  .viz-root{color-scheme:light;
    --bg:#f5ead8;--surface:#ebddc5;--card:#f9f4ed;--ink:#201e1d;
    --n100:#f9f4ed;--n200:#eee7db;--n300:#dcd3c4;--n400:#c0b6a5;--n500:#a19786;--n600:#82796a;--n700:#645c50;--n800:#474238;--n900:#2e2b25;
    --t200:#ffe1d0;--t300:#ffc6a5;--t400:#f6a06b;--t:#c67139;--t600:#b2622d;--t700:#8c491a;--t900:#402310;
    --g200:#e1eecc;--g300:#ccdbb2;--g400:#aebf92;--g:#7a8a5e;--g700:#56633f;--g800:#3d472b;
    --divider:rgba(32,30,29,.16);--rule:rgba(32,30,29,.08);
    --shadow:0 1px 2px rgba(46,43,37,.14);
    --head:'Caprasimo',serif;--body:'Figtree',ui-sans-serif,system-ui,sans-serif;
    --s1:#c67139;--s2:#7a8a5e;--s3:#f6a06b;--s4:#8c491a;--s5:#aebf92;--s6:#645c50;--s7:#56633f;--s8:#c0b6a5;--s9:#402310;--s10:#ffc6a5}
  *{box-sizing:border-box}
  html,body{margin:0;max-width:100%;overflow-x:clip;background:#f5ead8}
  .viz-root{background:var(--bg);color:var(--ink);font:14px/1.5 var(--body);min-height:100vh;
    -webkit-font-smoothing:antialiased;overflow-x:clip;max-width:100vw}
  a{color:var(--t700)}
  :focus-visible{outline:2px solid var(--t);outline-offset:2px}
  .num{font-variant-numeric:tabular-nums}

  /* ─── shell: top bar ─── */
  .topbar{position:sticky;top:0;z-index:50;background:rgba(245,234,216,.92);backdrop-filter:blur(8px);
    border-bottom:1px solid rgba(32,30,29,.1)}
  .tb1{display:flex;align-items:center;gap:20px;padding:12px 32px}
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);flex:none}
  .brandmark{width:34px;height:34px;border-radius:50%;background:var(--t);color:#f5ead8;display:grid;place-items:center;
    font:400 18px var(--head)}
  .wordmark{font:400 19px var(--head)}.wordmark b{color:var(--t);font-weight:400}
  .navpills{display:flex;background:var(--surface);border-radius:999px;padding:4px;gap:0;overflow-x:auto;scrollbar-width:none}
  .navpills::-webkit-scrollbar{display:none}
  .navpills a{font:600 13px var(--body);padding:7px 14px;border-radius:999px;text-decoration:none;color:var(--n700);white-space:nowrap}
  .navpills a.on{background:var(--t);color:#f5ead8}
  .tbspacer{flex:1}
  .auditstat{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--n600);white-space:nowrap}
  .auditstat::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--g)}
  .runbtn{font:400 14px var(--head);background:var(--t);color:#f5ead8;padding:9px 18px;border-radius:999px;border:none;
    cursor:pointer;white-space:nowrap;text-decoration:none}
  .runbtn:hover{background:var(--t600)}
  .tb2{display:flex;align-items:center;gap:6px;padding:0 32px 10px;overflow-x:auto;scrollbar-width:none}
  .tb2::-webkit-scrollbar{display:none}
  .tb2 .lbl{font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--n600);margin-right:4px;flex:none}
  .schip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 10px;border:1px solid rgba(32,30,29,.14);
    border-radius:999px;text-decoration:none;color:var(--ink);white-space:nowrap}
  .schip .dot{width:7px;height:7px}
  .schip.on{border-color:var(--t);background:var(--t200);color:var(--t700);font-weight:700}
  .wrap{max-width:1400px;margin:0 auto;padding:28px 32px 60px}

  /* ─── shared ─── */
  h1{font:400 40px/1.05 var(--head);margin:0 0 8px}
  .sub{font:400 15px var(--body);color:var(--n600);margin:0}
  h2{font:400 21px var(--head);margin:0}
  .card{background:var(--card);border-radius:16px;padding:16px 20px;box-shadow:var(--shadow)}
  .card.table{padding:0;overflow:hidden}
  .card.warn{background:var(--t200);color:var(--t900)}
  .card.pos{background:var(--g200);color:var(--g800)}
  .inset{background:var(--surface);border-radius:12px;padding:12px 14px}
  .kick{font:700 10px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--t)}
  .kick.n{color:var(--n600)}.kick.w{color:var(--t700)}.kick.p{color:var(--g700)}
  .big{font:400 34px/1.1 var(--head)}.big.sm{font-size:27px}
  .bar{height:8px;border-radius:999px;background:var(--surface);overflow:hidden}
  .bar i{display:block;height:100%;border-radius:999px;background:var(--t)}
  .bar i.done{background:var(--g)}
  .tag{display:inline-block;border-radius:999px;padding:2px 9px;font:700 10px var(--body);letter-spacing:.06em;text-transform:uppercase}
  .tag.pos{background:var(--g200);color:var(--g800)}
  .tag.warn{background:var(--t200);color:var(--t700)}
  .tag.neu{background:var(--n200);color:var(--n700)}
  .up{color:var(--g700);font-weight:600}.down{color:var(--t700);font-weight:600}.flat{color:var(--n500)}
  .btn{font:600 13px var(--body);border:1px solid var(--divider);background:transparent;color:var(--ink);
    padding:7px 16px;border-radius:999px;cursor:pointer;text-decoration:none;display:inline-block}
  .btn:hover{background:rgba(32,30,29,.07)}
  .btn.primary{font:400 14px var(--head);background:var(--t);color:#f5ead8;border:none}
  .btn.primary:hover{background:var(--t600)}
  .btn.sage{background:var(--g200);color:var(--g800);border:none}
  .btn.sage:hover{background:var(--g300)}
  .btn.sm{padding:5px 12px;font-size:12px}
  .linkbtn{font:600 12px var(--body);color:var(--t700);text-decoration:none}
  .seg{display:inline-flex;background:var(--surface);border-radius:999px;padding:3px}
  .seg button,.seg span{font:600 12px var(--body);padding:4px 12px;border-radius:999px;border:none;background:none;color:var(--n700);cursor:pointer}
  .seg .on{background:var(--t);color:#f5ead8}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th{font:600 11px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--n600);text-align:left;
    padding:8px 12px;border-bottom:1px solid var(--divider)}
  td{padding:10px 12px;border-bottom:1px solid var(--rule);font-variant-numeric:tabular-nums;vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tbody tr:hover{background:rgba(32,30,29,.04)}
  .overflow{overflow-x:auto;max-width:100%}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none;vertical-align:middle}
  .s1{background:var(--s1)}.s2{background:var(--s2)}.s3{background:var(--s3)}.s4{background:var(--s4)}.s5{background:var(--s5)}
  .s6{background:var(--s6)}.s7{background:var(--s7)}.s8{background:var(--s8)}.s9{background:var(--s9)}.s10{background:var(--s10)}
  .ck{width:24px;height:24px;border-radius:50%;border:1.5px solid rgba(32,30,29,.2);display:inline-grid;place-items:center;
    cursor:pointer;background:transparent;font:700 12px var(--body);color:transparent}
  .ck.sm{width:20px;height:20px}
  input:checked + .ck, .ck.done{background:var(--g);border-color:var(--g);color:#f5ead8}
  .grid{display:grid;gap:20px;margin:20px 0}
  .g2{grid-template-columns:1fr 1fr}.g169{grid-template-columns:1.6fr 1fr}.g149{grid-template-columns:1.4fr 1fr}
  .g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr);gap:14px}.g5{grid-template-columns:repeat(5,1fr);gap:14px}
  .stack{display:flex;flex-direction:column;gap:20px}
  .rowflex{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}
  .spark{stroke:var(--t);stroke-width:1.75;fill:none}
  .spark.g{stroke:var(--g);stroke-width:2}
  .hdr{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
  .cardhead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px 12px}
  .card.table .cardhead{border-bottom:none}
  .pcard pre{background:var(--surface);border-radius:12px;padding:12px 14px;font:12px/1.55 ui-monospace,Menlo,monospace;
    white-space:pre-wrap;word-break:break-word;color:var(--n800);margin:10px 0 0;max-height:340px;overflow:auto}
  .alertbanner{display:flex;align-items:center;gap:16px;padding:16px 20px;margin-bottom:20px}
  .alertbang{width:40px;height:40px;border-radius:50%;background:var(--t);color:#f5ead8;display:grid;place-items:center;
    font:400 18px var(--head);flex:none}
  .distbar{display:flex;gap:6px;height:6px;margin:12px 0 8px}
  .distbar i{border-radius:999px;height:6px}
  .moverow{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid rgba(32,30,29,.07);font-size:13px}
  .moverow:last-child{border-bottom:none}
  .moverow .pos{margin-left:auto;font:400 16px var(--head)}
  .kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;align-items:start}
  .kanban h3{font:400 18px var(--head);margin:0;display:flex;align-items:center;gap:8px}
  .kanban .cnt{background:var(--surface);border-radius:999px;padding:1px 10px;font:600 12px var(--body);color:var(--n700)}
  .task{background:var(--card);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;margin-top:12px}
  .task .meta{font-size:11px;color:var(--n600)}
  .cyc{display:flex;gap:12px;align-items:flex-start;padding:8px 0;font-size:13px}
  .cyc .n{width:26px;height:26px;border-radius:50%;background:var(--surface);display:grid;place-items:center;
    font:400 13px var(--head);flex:none}
  .milerow{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:13px}
  .milerow.done span{color:var(--n600);text-decoration:line-through}
  .healthchip{display:inline-flex;align-items:center;gap:7px;background:var(--card);border-radius:999px;
    padding:5px 13px 5px 6px;font-size:12.5px;box-shadow:var(--shadow)}
  .healthchip i{width:15px;height:15px;border-radius:50%;background:var(--g);color:#f5ead8;display:grid;place-items:center;
    font:700 9px var(--body);font-style:normal}
  .tile-hover:hover{background:#fff}
  .copybtn{font:600 13px var(--body);border:1px solid var(--divider);background:transparent;color:var(--ink);
    padding:5px 14px;border-radius:999px;cursor:pointer}
  .copybtn:hover{background:rgba(32,30,29,.07)}
  @media (max-width:1080px){.g2,.g169,.g149,.g3{grid-template-columns:1fr}.g4{grid-template-columns:1fr 1fr}
    .g5{grid-template-columns:1fr 1fr}.kanban{grid-template-columns:1fr 1fr}}
  @media (max-width:640px){.g4,.g5,.kanban{grid-template-columns:1fr}h1{font-size:31px}
    .tb1{padding:10px 16px;gap:10px}.tb2{padding:0 16px 10px}.wrap{padding:20px 16px 60px}
    .auditstat{display:none}}

  /* compat: previous board classes → Organic */
  .board{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;margin:0 0 20px}
  .board .card{margin:0}
  .t3{grid-column:span 3}.t4{grid-column:span 4}.t5{grid-column:span 5}.t6{grid-column:span 6}
  .t9{grid-column:span 9}.t12{grid-column:span 12}
  .tile{display:flex;flex-direction:column;gap:2px}
  .kpiL{font:700 10px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--n600)}
  .tileNum{font:400 33px/1.1 var(--head);color:var(--ink)}
  .tileNum small{font-size:16px;color:var(--n600)}
  .tileLbl{font-size:12px;color:var(--n600);margin-top:4px}
  .tileDelta{font:600 13px var(--body);margin-top:6px}
  .tileDelta.up{color:var(--g700)}.tileDelta.down{color:var(--t700)}
  .ctryTrack{height:8px;border-radius:999px;background:var(--surface);overflow:hidden;margin-top:8px}
  .ctryFill{height:100%;border-radius:999px;background:var(--t)}
  .rolehead{display:flex;align-items:center;gap:14px;margin:26px 0 12px;padding:14px 18px;background:var(--card);
    border-radius:16px;box-shadow:var(--shadow)}
  .rolehead h2{font-size:19px}
  .roleemoji{font-size:24px}.rolesub{font-size:12px;color:var(--n600)}
  .rolecount{margin-left:auto;background:var(--surface);color:var(--n700);font:600 12px var(--body);padding:5px 13px;border-radius:999px}
  .pcard .phead{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .pcard{margin-bottom:14px}
  .ptext{background:var(--surface);border-radius:12px;padding:12px 14px;font:12px/1.55 ui-monospace,Menlo,monospace;
    white-space:pre-wrap;word-break:break-word;color:var(--n800);margin:10px 0 0;max-height:340px;overflow:auto}
  .krank{display:inline-block;border-radius:999px;padding:2px 9px;font:700 11px var(--body)}
  .krank.good{background:var(--g200);color:var(--g800)}
  .krank.ok{background:var(--n200);color:var(--n700)}
  .krank.far{background:var(--t200);color:var(--t700)}
  .krank.miss{color:var(--n500);background:none;font-weight:500;font-size:12px}
  .badge{display:inline-block;border-radius:999px;padding:2px 9px;font:700 10px var(--body);letter-spacing:.06em;text-transform:uppercase}
  .badge.b-good{background:var(--g200);color:var(--g800)}.badge.b-flag{background:var(--g200);color:var(--g800)}
  .badge.b-warn{background:var(--t200);color:var(--t700)}.badge.b-neutral,.badge.b-bad{background:var(--n200);color:var(--n700)}
  .alert{border-radius:12px;padding:11px 15px;margin:8px 0;font-size:13.5px}
  .alert.crit{background:var(--t200);color:var(--t900)}
  .alert.warn{background:#fff2eb;color:var(--t900)}
  .alert.good{background:var(--g200);color:var(--g800)}
  .chglist{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
  .chg{font-size:13px;padding:8px 13px;border-radius:9px}
  .chg.good{background:var(--g200);color:var(--g800)}.chg.info{background:var(--n200);color:var(--n700)}
  .chg.down{background:var(--t200);color:var(--t700)}
  .miles .mile{display:flex;gap:12px;padding:7px 0;font-size:13px}
  .miledate{font:600 11px var(--body);color:var(--n600);min-width:48px}
  .lcl{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;font-size:13.5px}
  .slink{color:var(--t700)}
  .workstrip{display:flex;align-items:center;gap:16px;text-decoration:none;color:var(--ink)}
  .rectitle{font:700 10px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--n600);padding-top:10px}
  .tiers{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:12px}
  .tiercol{background:var(--surface);border-radius:12px;padding:12px 13px}
  .tierhead{font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--n600);display:flex;justify-content:space-between;margin-bottom:10px}
  .tierchips{display:flex;flex-direction:column;gap:7px}
  .tchip{display:flex;align-items:center;gap:7px;font-size:12px;flex-wrap:wrap}
  .tchip .krank{margin-left:auto}
  .tchip i{font:700 10px var(--body);font-style:normal}
  .tup{color:var(--g700)}.tdn{color:var(--t700)}
  .stmeta{font-size:11px;color:var(--n500)}
</style>
