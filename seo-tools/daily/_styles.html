<style>
  /* ============ TOKENS — Anthropic-inspired warm/flat ============ */
  .viz-root{color-scheme:dark;
    --surface:#14152e;--surface2:#1d1f3d;--card:#1e2040;--line:#2c2f56;--line2:#262949;
    --ink:#f2f3fa;--ink2:#c0c3dc;--ink3:#8489ad;
    --acc:#35c3f5;--acc2:#7ee0ff;--accsoft:#1b2c4a;
    --s1:#35c3f5;--s2:#8f7ff0;--s3:#f0c34e;--s4:#ff8fa8;--s5:#4fe0b0;--s6:#f09a4e;--s7:#9cb175;--s8:#c08aa9;--s9:#6f9dc0;--s10:#b8956d;
    --up:#3ddc84;--down:#ff5a72;
    --sh1:0 1px 2px rgba(0,0,0,.35);
    --sh2:0 8px 26px rgba(0,0,0,.45);
    --r:14px;--rs:10px;--rp:999px;
    --serif:"Segoe UI",ui-sans-serif,-apple-system,Roboto,Inter,sans-serif}
  



  /* ============ MISSION CONTROL v4 ============ */
  .statusline{display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:12px;margin-bottom:16px;
    font-size:13px;border:1px solid var(--line)}
  .statusline.ok{background:#e9f2e9;color:#3f6b42}.statusline.warn{background:#f7efdb;color:#8a6d1f}
  .statusline.crit{background:#f6e2dc;color:#a24632}
  .statusline .stdot{width:9px;height:9px;border-radius:50%;background:currentColor;flex:none;animation:stpulse 2.5s infinite}
  @keyframes stpulse{0%,100%{opacity:1}50%{opacity:.45}}
  .stmeta{margin-left:auto;font:500 11px ui-monospace,Menlo,monospace;color:var(--ink3)}
  .heroGrid{display:grid;grid-template-columns:auto 1fr;gap:34px;align-items:center}
  .heroMain h1{margin-bottom:6px}
  .heroNum{font-family:var(--serif);font-size:56px;font-weight:500;letter-spacing:-.02em;line-height:1;color:var(--acc);margin:10px 0 4px}
  .heroUnit{font:600 13px ui-sans-serif,sans-serif;color:var(--ink3);margin-left:10px;letter-spacing:0}
  .heroSpark{margin-top:10px;max-width:260px}
  .movecard{border-left:4px solid var(--acc)}
  .movegrid{display:flex;flex-direction:column;gap:10px;margin-top:12px}
  .move{display:flex;align-items:center;gap:14px;padding:13px 16px;border:1px solid var(--line);border-radius:12px;
    text-decoration:none;color:var(--ink);background:var(--surface2);transition:.15s}
  .move:hover{border-color:var(--acc);box-shadow:var(--sh1)}
  .moveN{width:30px;height:30px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;
    font:700 15px ui-sans-serif,sans-serif;flex:none}
  .moveT{display:flex;flex-direction:column;gap:2px;min-width:0}
  .moveT b{font-size:14px}.moveT span{font-size:12px;color:var(--ink3)}
  .move .srarrow{margin-left:auto}
  .league{display:flex;flex-direction:column;gap:6px;margin-top:8px}
  .lgrow{display:flex;align-items:center;gap:12px;padding:10px 14px;border:1px solid var(--line2);border-radius:12px;
    text-decoration:none;color:var(--ink);transition:.15s;flex-wrap:wrap}
  .lgrow:hover{border-color:var(--acc);background:var(--surface2)}
  .lgpos{font:700 15px ui-monospace,Menlo,monospace;color:var(--ink3);width:20px;text-align:center;flex:none}
  .lgname{font:600 13.5px ui-monospace,Menlo,monospace;min-width:150px}
  .lgspark{width:90px;flex:none}.lgspark svg{width:90px;height:24px}
  .lgclicks{font:700 15px ui-sans-serif,sans-serif;min-width:95px;font-variant-numeric:tabular-nums}
  .lgclicks small{font-weight:500;color:var(--ink3)}
  .lgbest{display:flex;align-items:center;gap:6px;min-width:170px}
  .lgkw{font-size:11.5px;color:var(--ink3)}
  .lgrd{font:600 13px ui-sans-serif,sans-serif;min-width:52px;color:var(--ink2)}
  .lgrd small{color:var(--ink3);font-weight:500}
  .lgrow .badge{margin-left:auto}
  .tiers{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:12px}
  .tiercol{background:var(--surface2);border:1px solid var(--line2);border-radius:12px;padding:12px 13px}
  .tierhead{font:600 11px ui-monospace,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);
    display:flex;justify-content:space-between;margin-bottom:10px}
  .tierhead b{color:var(--ink)}
  .tierchips{display:flex;flex-direction:column;gap:7px}
  .tchip{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink2);flex-wrap:wrap}
  .tchip .krank{margin-left:auto}
  .tchip i{font:700 10px ui-sans-serif,sans-serif;font-style:normal}
  .tup{color:var(--up)}.tdn{color:var(--down)}
  .miles{display:flex;flex-direction:column;gap:0;margin-top:10px}
  .mile{display:flex;gap:14px;padding:9px 0 9px 18px;border-left:2px solid var(--line);position:relative;font-size:13px}
  .mile::before{content:"";position:absolute;left:-5px;top:14px;width:8px;height:8px;border-radius:50%;
    background:var(--acc);border:2px solid var(--card)}
  .miledate{font:600 11px ui-monospace,Menlo,monospace;color:var(--ink3);min-width:52px;flex:none;padding-top:1px}
  @media (max-width:860px){.heroGrid{grid-template-columns:1fr;gap:18px}.heroNum{font-size:44px}
    .lgspark{display:none}.lgbest{min-width:0}}

  .gpills{display:flex;flex-direction:column;gap:12px;min-width:260px}
  .gpill{display:flex;flex-direction:column;gap:4px}
  .gpillL{font:600 10.5px ui-monospace,Menlo,monospace;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3)}
  .gpill.done .gpillL{color:var(--up)}
  .gpillV{font:600 13px ui-sans-serif,sans-serif;font-variant-numeric:tabular-nums}
  @media (max-width:860px){.gpills{min-width:0}}
  /* ============ BASE + SHELL ============ */
  *{box-sizing:border-box}
  html,body{margin:0;max-width:100%;overflow-x:hidden;overflow-x:clip;background:#14152e}
  
  :root,body{background:#14152e}
  .viz-root{background:var(--surface);color:var(--ink);
    font:14.5px/1.6 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Inter,sans-serif;
    min-height:100vh;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    overflow-x:clip;max-width:100vw}
  .main,.wrap,.card{min-width:0;max-width:100%}
  .spk,.kpiSpark svg{max-width:100%}
  .overflow{max-width:100%}
  a{color:var(--acc)}
  .app{display:flex;align-items:flex-start}
  .main{flex:1;min-width:0}
  .wrap{max-width:1060px;margin:0 auto;padding:30px 30px 90px}
  h1{font-family:var(--serif);font-size:34px;font-weight:500;letter-spacing:-.01em;margin:0;line-height:1.12}
  .meta{color:var(--ink3);font-size:12.5px;margin:10px 0 22px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
  .freshpill{display:inline-flex;align-items:center;gap:6px;background:var(--accsoft);color:var(--acc);
    font:600 11.5px ui-monospace,Menlo,monospace;padding:4px 11px;border-radius:var(--rp)}
  .freshpill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--up)}
  .backlink{display:none}
  .ic{width:1em;height:1em;flex:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;fill:none}

  /* ============ SIDEBAR ============ */
  .side{position:sticky;top:0;align-self:flex-start;width:240px;flex:none;height:100vh;height:100dvh;
    display:flex;flex-direction:column;gap:6px;padding:24px 16px;
    background:var(--surface);border-right:1px solid var(--line);overflow-y:auto}
  .brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--ink);
    font-family:var(--serif);font-size:19px;font-weight:500;letter-spacing:-.01em;padding:2px 8px 20px}
  .brand b{color:var(--acc);font-weight:500}
  .brandmark{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:#fff;
    background:var(--acc)}
  .brandmark .ic{width:17px;height:17px;fill:#fff;stroke:none}
  .nav{display:flex;flex-direction:column;gap:2px}
  .navitem{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:10px;text-decoration:none;
    color:var(--ink2);font:500 14px ui-sans-serif,-apple-system,sans-serif;transition:background .15s,color .15s}
  .navitem:hover{background:var(--surface2);color:var(--ink)}
  .navitem.on{background:var(--card);color:var(--ink);box-shadow:var(--sh1);font-weight:600}
  .navitem.on .navicon{color:var(--acc)}
  .navicon{width:20px;height:20px;display:grid;place-items:center;flex:none;color:var(--ink3)}
  .navicon .ic{width:18px;height:18px}
  .navsec{font:600 10px ui-monospace,Menlo,monospace;letter-spacing:.12em;color:var(--ink3);text-transform:uppercase;padding:18px 12px 6px}
  .navitem.site{font:500 13px ui-monospace,SFMono-Regular,Menlo,monospace;padding:8px 12px}
  .navitem.site .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .navitem.site.on{background:var(--card)}
  .sidefoot{margin-top:auto;padding:14px 11px 0;font:500 10.5px ui-monospace,Menlo,monospace;color:var(--ink3);border-top:1px solid var(--line2)}

  /* ============ CARDS ============ */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px;
    margin-bottom:18px;transition:border-color .2s,box-shadow .2s}
  .card:hover{box-shadow:var(--sh1)}
  .card h2{font-size:15.5px;font-weight:600;letter-spacing:-.01em;margin:0 0 3px;display:flex;align-items:center;gap:10px}
  .card h2 .ic{width:18px;height:18px;color:var(--acc)}
  .card .sub{font-size:12.5px;color:var(--ink3);margin:0 0 14px;line-height:1.55}
  .iconchip{display:inline-grid;place-items:center;color:var(--acc)}
  .iconchip .ic{width:18px;height:18px}

  /* ============ HERO + KPIs (flat) ============ */
  .hero{margin:0 0 20px;padding:26px 26px 24px;border-radius:var(--r);border:1px solid var(--line);background:var(--card)}
  .heroTop{margin-bottom:22px}
  .kpibar{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:22px}
  .kpi{display:flex;flex-direction:column;gap:2px;position:relative;padding-left:2px}
  .kpiHd{display:flex;align-items:center;gap:8px;margin-bottom:4px;color:var(--ink3)}
  .kpiIcon{display:grid;place-items:center;color:var(--acc)}
  .kpiIcon .ic{width:17px;height:17px}
  .kpiL{font:600 10.5px ui-monospace,Menlo,monospace;letter-spacing:.05em;color:var(--ink3);text-transform:uppercase}
  .kpiV{font-family:var(--serif);font-size:34px;font-weight:500;letter-spacing:-.01em;line-height:1.05;color:var(--ink)}
  .kpi.urg .kpiV{color:var(--acc)}
  .kpiFoot{font:500 11px ui-sans-serif,-apple-system,sans-serif;color:var(--ink3);margin-top:5px}
  .kdelta{display:inline-flex;align-items:center;gap:3px;font:600 12px ui-sans-serif,sans-serif;margin-top:4px}
  .kdelta.up{color:var(--up)}.kdelta.down{color:var(--down)}.kdelta.flat{color:var(--ink3)}
  .kpiSpark{margin-top:9px}

  /* ============ GRID ============ */
  .grid2{display:grid;grid-template-columns:1.7fr 1fr;gap:18px;margin-bottom:18px;align-items:start}
  .rail{display:flex;flex-direction:column;gap:18px}
  .rail .card,.grid2 .card{margin-bottom:0}
  .phead{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .rangepills{display:flex;gap:6px}
  .rangepills button{background:none;border:1px solid var(--line);border-radius:var(--rp);color:var(--ink3);font:600 11.5px ui-sans-serif,sans-serif;padding:5px 11px;cursor:pointer;transition:.15s}
  .rangepills button.on{background:var(--acc);color:#fff;border-color:var(--acc)}

  /* ============ COUNTRY ============ */
  .ctry{display:flex;flex-direction:column;gap:14px;margin-top:4px}
  .ctryRow{display:grid;grid-template-columns:24px 1fr auto;gap:11px;align-items:center}
  .ctryFlag{font-size:19px;line-height:1}
  .ctryBarWrap{display:flex;flex-direction:column;gap:5px;min-width:0}
  .ctryName{font:500 12px ui-sans-serif,sans-serif;color:var(--ink2);display:flex;justify-content:space-between;gap:8px}
  .ctryTrack{height:7px;border-radius:var(--rp);background:var(--surface2);overflow:hidden}
  .ctryFill{height:100%;border-radius:var(--rp);background:var(--acc)}
  .ctryVal{font:600 13px ui-sans-serif,sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap}

  /* ============ GAUGES ============ */
  .gauges{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-around}
  .gauge{display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;flex:1;min-width:88px}
  .gauge svg{transform:rotate(-90deg)}
  .gaugeC{font-family:var(--serif);font-size:16px;font-weight:500;fill:var(--ink);transform:rotate(90deg);transform-origin:center}
  .gaugeL{font:500 11px ui-sans-serif,sans-serif;color:var(--ink3);line-height:1.3}
  .oppcard{background:var(--accsoft);border-color:color-mix(in srgb,var(--acc) 30%,var(--line))}
  .oppNum{font-family:var(--serif);font-size:30px;font-weight:500;letter-spacing:-.01em;line-height:1;margin:3px 0 4px;color:var(--acc)}

  /* ============ LEGACY TILES ============ */
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:22px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;position:relative;overflow:hidden}
  .tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--acc)}
  .thead{display:flex;align-items:center;gap:8px;margin-bottom:9px}
  .swatch{width:10px;height:10px;border-radius:3px;flex:none}
  .s1{background:var(--s1)}.s2{background:var(--s2)}.s3{background:var(--s3)}.s4{background:var(--s4)}.s5{background:var(--s5)}.s6{background:var(--s6)}.s7{background:var(--s7)}.s8{background:var(--s8)}.s9{background:var(--s9)}.s10{background:var(--s10)}
  .tname{font:500 12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink2)}
  .tnum{font-family:var(--serif);font-size:27px;font-weight:500;font-variant-numeric:tabular-nums}
  .tunit{font-size:11px;font-weight:500;color:var(--ink3);margin-left:6px}
  .trow{font-size:12px;color:var(--ink2);margin-top:5px}.trow.muted{color:var(--ink3)}
  .d{font-variant-numeric:tabular-nums;font-weight:600}.d.up{color:var(--up)}.d.down{color:var(--down)}.d.flat{color:var(--ink3)}

  /* ============ CHART ============ */
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-bottom:10px}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  #chartbox{position:relative}
  #tip{position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:12px;display:none;box-shadow:var(--sh2);white-space:nowrap;z-index:2}
  svg text{fill:var(--ink3);font:10.5px ui-monospace,SFMono-Regular,Menlo,monospace}
  svg .dl{font:11px ui-sans-serif,-apple-system,sans-serif;font-weight:600}

  /* ============ TABLES ============ */
  table{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
  th{color:var(--ink3);font-weight:600;text-align:right;padding:9px 10px;border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.03em;text-transform:uppercase}
  th:first-child,td:first-child{text-align:left;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  td{padding:9px 10px;border-bottom:1px solid var(--line2);text-align:right;vertical-align:top;color:var(--ink)}
  td:nth-child(2),td:nth-child(3),th:nth-child(2),th:nth-child(3){text-align:left}
  tbody tr{transition:background .14s}tbody tr:hover{background:var(--surface2)}
  tr:last-child td{border-bottom:none}
  .overflow{overflow-x:auto;margin:0 -4px}

  /* ============ SITE CARDS ============ */
  .scards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
  .scard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:13px;max-width:100%;transition:border-color .2s,box-shadow .2s}
  .scard:hover{box-shadow:var(--sh1);border-color:color-mix(in srgb,var(--acc) 26%,var(--line))}
  .schead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .sname{font:600 15px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:-.01em}
  .slink{color:var(--acc);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--acc) 35%,transparent)}
  .slink:hover{border-bottom-color:var(--acc)}
  .sdesc{font-size:12px;color:var(--ink3);margin-top:3px}
  .badge{font:600 10px ui-sans-serif,-apple-system,sans-serif;letter-spacing:.03em;padding:5px 10px;border-radius:var(--rp);white-space:nowrap;flex:none;text-transform:uppercase}
  .b-good{background:#e4efe4;color:#3f6b42}.b-flag{background:#e8ebf0;color:#4a5a72}
  .b-warn{background:#f6e9dc;color:#8a5a25}.b-bad{background:#f6e2dc;color:#a24632}.b-neutral{background:#efe9d8;color:#7a6a30}
  .stats{display:flex;gap:22px;flex-wrap:wrap;padding-top:2px}
  .st{display:flex;flex-direction:column;gap:3px}
  .stl{font:600 9.5px ui-monospace,Menlo,monospace;letter-spacing:.05em;color:var(--ink3);text-transform:uppercase}
  .stv{font-family:var(--serif);font-size:21px;font-weight:500;font-variant-numeric:tabular-nums}
  .sec{border-top:1px solid var(--line2);padding-top:11px;display:flex;flex-direction:column;gap:3px}
  .chartblk{border-top:1px solid var(--line2);padding-top:11px}
  .barlabel{font:600 9.5px ui-monospace,Menlo,monospace;letter-spacing:.05em;color:var(--ink3);text-transform:uppercase;margin-bottom:9px}
  .bars{display:flex;gap:14px;align-items:flex-end;height:100px}
  .bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px}
  .bv{font:600 12px ui-sans-serif,sans-serif;font-variant-numeric:tabular-nums}
  .bt{width:100%;max-width:56px;background:var(--acc);opacity:.4;border-radius:5px 5px 0 0;min-height:4px}
  .bt.hot{opacity:1}
  .bl{font:10px ui-monospace,Menlo,monospace;color:var(--ink3)}
  .nodata{font-size:12px;color:var(--ink3);font-style:italic;padding:10px 0}
  .narr{font-size:12.5px;line-height:1.6;color:var(--ink2);margin:0;border-left:2px solid var(--acc);padding:2px 0 2px 13px}

  /* ============ RECS / TAGS ============ */
  .rectitle{font:600 9.5px ui-monospace,Menlo,monospace;letter-spacing:.05em;color:var(--ink3);text-transform:uppercase;border-top:1px solid var(--line2);padding-top:13px}
  .recs{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
  .recs li{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;line-height:1.5;color:var(--ink2)}
  .tag{font:600 9px ui-monospace,Menlo,monospace;letter-spacing:.03em;padding:3px 6px;border-radius:5px;flex:none;margin-top:1px;min-width:34px;text-align:center}
  .tp0{background:#f6e2dc;color:#a24632}.tdo{background:var(--surface2);color:var(--ink2)}
  .topen{background:#e8ebf0;color:#4a5a72}.tkpi{background:#e4efe4;color:#3f6b42}
  .twatch{background:var(--surface2);color:var(--ink3)}.towner{background:#f6e9dc;color:#8a5a25}
  .lcl{margin:0;padding-left:20px;font-size:12.5px;color:var(--ink2);line-height:1.6} .lcl li{margin-bottom:8px}

  /* ============ PROMPTS ============ */
  .pcard .phead{margin-bottom:10px}
  .copybtn{background:var(--acc);color:#fff;border:none;border-radius:var(--rs);padding:8px 16px;font:600 12.5px ui-sans-serif,-apple-system,sans-serif;cursor:pointer;transition:background .18s,transform .12s}
  .copybtn:hover{background:var(--acc2)}.copybtn:active{transform:scale(.96)}.copybtn.ok{background:var(--up)}
  .ptext{background:var(--surface);border:1px solid var(--line);border-radius:var(--rs);padding:14px 16px;font:12px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;overflow-x:auto;max-height:360px;overflow-y:auto;margin:0;color:var(--ink2)}

  /* ============ KEYWORD / TREND ============ */
  .kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:18px}
  .kcard .phead{align-items:baseline;margin-bottom:0}
  .klabel{font:500 11px ui-sans-serif,-apple-system,sans-serif;color:var(--ink3);white-space:nowrap;flex:none}
  .krank{font:600 10.5px ui-monospace,Menlo,monospace;padding:3px 8px;border-radius:var(--rp);white-space:nowrap}
  .krank.good{background:#e4efe4;color:#3f6b42}.krank.ok{background:#e8ebf0;color:#4a5a72}
