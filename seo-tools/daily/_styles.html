<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ═══════ v4 design system — premium neutral analytics ═══════ */
  .viz-root{color-scheme:light;
    --bg:#fafafa;--card:#ffffff;--ink:#171717;--mut:#6b7280;--faint:#9ca3af;
    --line:#e5e7eb;--line2:#f3f4f6;--soft:#f9fafb;
    --acc:#4f46e5;--acc-bg:#eef2ff;--acc-dk:#3730a3;
    --pos:#16a34a;--pos-bg:#f0fdf4;--neg:#dc2626;--neg-bg:#fef2f2;
    --amb:#d97706;--amb-bg:#fffbeb;
    --shadow:0 1px 2px rgba(0,0,0,.05);
    --body:'Inter',ui-sans-serif,system-ui,sans-serif;
    --s1:#4f46e5;--s2:#0891b2;--s3:#d97706;--s4:#dc2626;--s5:#16a34a;--s6:#7c3aed;
    --s7:#be185d;--s8:#0d9488;--s9:#a16207;--s10:#475569;--s11:#c2410c}
  *{box-sizing:border-box}
  html,body{margin:0;max-width:100%;overflow-x:clip;background:#fafafa}
  .viz-root{background:var(--bg);color:var(--ink);font:13.5px/1.55 var(--body);min-height:100vh;
    -webkit-font-smoothing:antialiased;overflow-x:clip;max-width:100vw}
  a{color:var(--acc);text-decoration:none}
  a:hover{text-decoration:underline}
  :focus-visible{outline:2px solid var(--acc);outline-offset:2px}
  .num{font-variant-numeric:tabular-nums}

  /* ─── application shell: sidebar + main ─── */
  .app{display:grid;grid-template-columns:216px 1fr;min-height:100vh}
  .side{background:#fff;border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:0;
    height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
  .side .brand{display:flex;align-items:center;gap:9px;padding:4px 8px 14px;color:var(--ink)}
  .side .brand:hover{text-decoration:none}
  .bmark{width:26px;height:26px;border-radius:7px;background:var(--acc);color:#fff;display:grid;
    place-items:center;font:700 13px var(--body);flex:none}
  .bname{font:600 14px var(--body)}
  .navgrp{font:600 10.5px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);
    padding:14px 8px 4px}
  .side nav a{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:7px;
    font:500 13px var(--body);color:#374151;text-decoration:none}
  .side nav a:hover{background:var(--soft);text-decoration:none}
  .side nav a.on{background:var(--acc-bg);color:var(--acc-dk);font-weight:600}
  .side nav a .ic{width:15px;height:15px;color:var(--faint)}
  .side nav a.on .ic{color:var(--acc)}
  .side .foot{margin-top:auto;padding:10px 8px 2px;font-size:11px;color:var(--faint);border-top:1px solid var(--line2)}

  .main{min-width:0;display:flex;flex-direction:column}
  .toph{background:rgba(250,250,250,.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;padding:10px 28px;flex-wrap:wrap}
  .crumb{font:600 14px var(--body);color:var(--ink);margin-right:auto;display:flex;align-items:center;gap:8px}
  .fresh{display:flex;gap:14px;font-size:11.5px;color:var(--mut);flex-wrap:wrap}
  .fresh b{font-weight:600;color:#374151}
  .fresh .fdot{width:6px;height:6px;border-radius:50%;background:var(--pos);display:inline-block;margin-right:4px;vertical-align:1px}
  .fresh .fdot.warn{background:var(--amb)}.fresh .fdot.off{background:var(--faint)}
  .runbtn{font:600 12.5px var(--body);background:var(--acc);color:#fff;padding:7px 14px;border-radius:7px;
    border:none;cursor:pointer;white-space:nowrap}
  .runbtn:hover{background:var(--acc-dk)}
  .wrap{padding:24px 28px 64px;max-width:1480px;width:100%;margin:0 auto}

  /* site selector */
  .siteselect{position:relative}
  .siteselect>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:7px;
    font:600 12.5px var(--body);color:var(--ink);border:1px solid var(--line);background:#fff;
    padding:6px 12px;border-radius:7px;white-space:nowrap}
  .siteselect>summary::-webkit-details-marker{display:none}
  .siteselect>summary:after{content:"▾";color:var(--faint);font-size:10px}
  .sitemenu{position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);
    border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.09);min-width:280px;padding:6px;z-index:60;
    max-height:70vh;overflow:auto}
  .sitemenu a{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:7px;color:var(--ink);
    font-size:12.5px;text-decoration:none}
  .sitemenu a:hover{background:var(--soft);text-decoration:none}
  .sitemenu a .meta{margin-left:auto;color:var(--faint);font-size:11px;text-align:right}
  .sitemenu .allrow{border-bottom:1px solid var(--line2);margin-bottom:4px;padding-bottom:8px;font-weight:600}

  /* ─── primitives ─── */
  h1{font:700 20px/1.3 var(--body);margin:0 0 4px;letter-spacing:-.01em}
  h2{font:600 14.5px/1.35 var(--body);margin:0;letter-spacing:-.005em}
  h3{font:600 13px var(--body);margin:0}
  .sub{font:400 12.5px var(--body);color:var(--mut);margin:0}
  .pagehead{margin-bottom:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;box-shadow:var(--shadow)}
  .card.flush{padding:0;overflow:hidden}
  .card .chead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .card.flush .chead{padding:14px 18px 0;margin-bottom:8px}
  .grid{display:grid;gap:16px;margin:16px 0}
  .g2{grid-template-columns:1fr 1fr}.g23{grid-template-columns:1.5fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
  .stack{display:flex;flex-direction:column;gap:16px}
  .kick{font:600 10.5px var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
  .up{color:var(--pos);font-weight:600}.down{color:var(--neg);font-weight:600}.flat{color:var(--faint);font-weight:500}
  .tag{display:inline-flex;align-items:center;border-radius:5px;padding:1.5px 7px;font:600 10.5px var(--body);
    letter-spacing:.02em;white-space:nowrap}
  .tag.pos{background:var(--pos-bg);color:var(--pos)}
  .tag.neg{background:var(--neg-bg);color:var(--neg)}
  .tag.warn{background:var(--amb-bg);color:var(--amb)}
  .tag.neu{background:var(--line2);color:#4b5563}
  .tag.acc{background:var(--acc-bg);color:var(--acc-dk)}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none;vertical-align:middle}
  .s1{background:var(--s1)}.s2{background:var(--s2)}.s3{background:var(--s3)}.s4{background:var(--s4)}
  .s5{background:var(--s5)}.s6{background:var(--s6)}.s7{background:var(--s7)}.s8{background:var(--s8)}
  .s9{background:var(--s9)}.s10{background:var(--s10)}.s11{background:var(--s11)}
  .btn{font:600 12px var(--body);border:1px solid var(--line);background:#fff;color:var(--ink);
    padding:6px 12px;border-radius:7px;cursor:pointer;text-decoration:none;display:inline-block}
  .btn:hover{background:var(--soft);text-decoration:none}
  .btn.primary{background:var(--acc);color:#fff;border-color:var(--acc)}
  .btn.sm{padding:4px 9px;font-size:11.5px}
  .copybtn{font:600 11.5px var(--body);border:1px solid var(--line);background:#fff;color:var(--ink);
    padding:4px 11px;border-radius:6px;cursor:pointer}
  .copybtn:hover{background:var(--soft)}
  .ic{width:1em;height:1em;flex:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;
    stroke-linejoin:round;fill:none;vertical-align:-0.12em;display:inline-block}
  svg:not([width]):not(.ic){max-width:100%;max-height:240px}
  .mono{font-family:ui-monospace,Menlo,monospace;font-size:11.5px}

  /* KPI tiles */
  .kpirow{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:12px;margin:0 0 16px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;
    display:flex;flex-direction:column;gap:2px;position:relative;min-width:0}
  .kpi .kl{font:600 10.5px var(--body);letter-spacing:.05em;text-transform:uppercase;color:var(--mut);
    display:flex;align-items:center;gap:5px}
  .kpi .kv{font:700 21px/1.25 var(--body);letter-spacing:-.02em;color:var(--ink);font-variant-numeric:tabular-nums}
  .kpi .kv small{font-size:12px;font-weight:500;color:var(--mut)}
  .kpi .kd{font-size:11.5px;color:var(--mut)}
  .kpi .kspark{margin-top:6px}
  .kpi .src{position:absolute;top:10px;right:10px;color:var(--faint);cursor:help}
  .kpi .src:hover .tip{display:block}
  .tip{display:none;position:absolute;right:0;top:18px;z-index:50;background:#171717;color:#f5f5f5;
    font:400 11px/1.5 var(--body);padding:8px 10px;border-radius:7px;width:230px;white-space:normal;text-align:left}
  .spark{stroke:var(--acc);stroke-width:1.6;fill:none}
  .spark.g{stroke:var(--pos)}

  /* tables */
  table{border-collapse:collapse;width:100%;font-size:12.5px}
  th{font:600 10.5px var(--body);letter-spacing:.05em;text-transform:uppercase;color:var(--mut);
    text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;
    background:var(--soft);position:sticky;top:0}
  th.sortable{cursor:pointer}
  th.sortable:hover{color:var(--ink)}
  td{padding:7px 10px;border-bottom:1px solid var(--line2);font-variant-numeric:tabular-nums;vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tbody tr:hover{background:var(--soft)}
  .overflow{overflow-x:auto;max-width:100%}
  .twrap{overflow:auto;max-height:560px}

  /* filter pills */
  .fbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 10px}
  .fpill{font:600 11.5px var(--body);border:1px solid var(--line);background:#fff;color:#374151;
    padding:4px 11px;border-radius:999px;cursor:pointer}
  .fpill:hover{background:var(--soft)}
  .fpill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:#fff}
  .seg button{font:600 11.5px var(--body);padding:5px 12px;border:none;background:#fff;color:var(--mut);cursor:pointer}
  .seg button.on{background:var(--ink);color:#fff}

  /* alerts / severity */
  .sev{display:inline-flex;border-radius:5px;padding:1.5px 7px;font:700 10px var(--body);letter-spacing:.05em}
  .sev.critical{background:var(--neg);color:#fff}
  .sev.high{background:var(--neg-bg);color:var(--neg)}
  .sev.medium{background:var(--amb-bg);color:var(--amb)}
  .sev.low{background:var(--line2);color:var(--mut)}
  .alertrow{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line2);font-size:12.5px}
  .alertrow:last-child{border-bottom:none}
  .alertrow .sev{flex:none;margin-top:1px}

  /* what-changed feed */
  .chg{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line2);font-size:12.5px}
  .chg:last-child{border-bottom:none}
  .chg .cico{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;flex:none;font:700 11px var(--body)}
  .chg.good .cico{background:var(--pos-bg);color:var(--pos)}
  .chg.bad .cico{background:var(--neg-bg);color:var(--neg)}
  .chg.info .cico{background:var(--line2);color:var(--mut)}
  .chg .cbody{min-width:0}
  .chg .cmeta{font-size:11px;color:var(--faint);margin-top:1px}
  .hypo{font-size:11px;color:var(--mut);font-style:italic}

  /* opportunity cards */
  .opp{border:1px solid var(--line);border-radius:10px;padding:13px 15px;background:#fff;display:flex;
    flex-direction:column;gap:6px}
  .opp .ohead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .opp .score{font:700 13px var(--body);background:var(--acc-bg);color:var(--acc-dk);border-radius:6px;
    padding:2px 8px;font-variant-numeric:tabular-nums}
  .opp .orow{font-size:12px;color:#374151}
  .opp .orow b{font-weight:600}
  .opp .ofoot{font-size:11px;color:var(--faint);display:flex;gap:10px;flex-wrap:wrap}

  /* charts */
  .chart{position:relative}
  .chart .hoverline{position:absolute;top:0;bottom:22px;width:1px;background:var(--faint);display:none;pointer-events:none}
  .chart .htip{position:absolute;background:#171717;color:#f5f5f5;font:400 11px/1.5 var(--body);
    padding:6px 9px;border-radius:6px;pointer-events:none;display:none;white-space:nowrap;z-index:30}
  .legend{display:flex;gap:14px;font-size:11.5px;color:var(--mut);flex-wrap:wrap}
  .legend i{width:10px;height:3px;border-radius:2px;display:inline-block;vertical-align:middle;margin-right:5px}
  .axis{font:400 10px var(--body);fill:var(--faint)}
  .gridline{stroke:var(--line2);stroke-width:1}

  /* distribution / bars */
  .bar{height:7px;border-radius:999px;background:var(--line2);overflow:hidden}
  .bar i{display:block;height:100%;border-radius:999px;background:var(--acc)}
  .bar i.done{background:var(--pos)}
  .distbar{display:flex;gap:4px;height:6px;margin:10px 0 6px}
  .distbar i{border-radius:999px;height:6px}
  .hbar{display:flex;align-items:center;gap:9px;font-size:12px;padding:3px 0}
  .hbar .hlab{width:110px;color:#374151;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hbar .htrack{flex:1;height:7px;background:var(--line2);border-radius:999px;overflow:hidden}
  .hbar .htrack i{display:block;height:100%;background:var(--acc);border-radius:999px}
  .hbar .hval{width:76px;text-align:right;color:var(--mut);font-variant-numeric:tabular-nums;flex:none;font-size:11.5px}

  /* empty / setup states */
  .empty{border:1px dashed var(--line);border-radius:10px;padding:18px;text-align:center;color:var(--mut);
    font-size:12.5px;background:var(--soft)}
  .empty b{color:#374151}

  /* details / progressive disclosure */
  details.panel{border:1px solid var(--line);border-radius:10px;background:#fff}
  details.panel>summary{list-style:none;cursor:pointer;padding:11px 15px;font:600 13px var(--body);
    display:flex;align-items:center;gap:8px}
  details.panel>summary::-webkit-details-marker{display:none}
  details.panel>summary:after{content:"▸";margin-left:auto;color:var(--faint);transition:transform .15s}
  details.panel[open]>summary:after{transform:rotate(90deg)}
  details.panel>.pbody{padding:0 15px 13px;font-size:12.5px}
  .ptext,.pcard pre{background:var(--soft);border:1px solid var(--line2);border-radius:8px;padding:11px 13px;
    font:11.5px/1.55 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-word;color:#374151;
    margin:8px 0 0;max-height:320px;overflow:auto}

  /* work board */
  .kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:start}
  .kanban h3{display:flex;align-items:center;gap:7px;font-size:12.5px}
  .kanban .cnt{background:var(--line2);border-radius:999px;padding:0 8px;font:600 11px var(--body);color:var(--mut)}
  .task{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow);
    display:flex;flex-direction:column;gap:7px;margin-top:10px;font-size:12.5px}
  .task .meta{font-size:11px;color:var(--faint)}
  .task .chips{display:flex;gap:5px;flex-wrap:wrap}

  /* checklist compat (links drawer) */
  .ck{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);display:inline-grid;place-items:center;
    cursor:pointer;background:#fff;font:700 11px var(--body);color:transparent}
  input:checked + .ck, .ck.done{background:var(--pos);border-color:var(--pos);color:#fff}
  .tiers{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:10px}
  .tiercol{background:var(--soft);border:1px solid var(--line2);border-radius:8px;padding:10px 12px}
  .tierhead{font:600 10.5px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--mut);
    display:flex;justify-content:space-between;margin-bottom:8px}
  .tierchips{display:flex;flex-direction:column;gap:6px}
  .tchip{display:flex;align-items:center;gap:6px;font-size:11.5px;flex-wrap:wrap}
  .tchip .krank{margin-left:auto}
  .tchip i{font:700 10px var(--body);font-style:normal}
  .tup{color:var(--pos)}.tdn{color:var(--neg)}

  /* rank pills */
  .krank{display:inline-block;border-radius:5px;padding:1.5px 7px;font:700 11px var(--body)}
  .krank.good{background:var(--pos-bg);color:var(--pos)}
  .krank.ok{background:var(--line2);color:#4b5563}
  .krank.far{background:var(--amb-bg);color:var(--amb)}
  .krank.miss{color:var(--faint);background:none;font-weight:500;font-size:11.5px}

  /* legacy compat (site cards, prompts, milestones) mapped to v4 look */
  .hchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
  .hchip{display:inline-flex;align-items:center;gap:4px;border-radius:5px;padding:2.5px 9px;font:600 11px var(--body)}
  .hchip.ok{background:var(--pos-bg);color:var(--pos)}
  .hchip.bad{background:var(--neg-bg);color:var(--neg)}
  .rectitle{font:600 10.5px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
  .secrow{margin-top:14px}
  .statrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;
    background:var(--soft);border:1px solid var(--line2);border-radius:8px;padding:11px 14px;margin-top:10px}
  .st{display:flex;flex-direction:column;gap:1px;min-width:0}
  .stl{font:600 10px var(--body);letter-spacing:.05em;text-transform:uppercase;color:var(--mut)}
  .stv{font:600 16px/1.3 var(--body);color:var(--ink);font-variant-numeric:tabular-nums}
  .narr{font-size:12.5px;line-height:1.6;color:#374151;margin:8px 0 0;max-width:78ch}
  .recs{list-style:none;margin:7px 0 0;padding:0;display:flex;flex-direction:column;gap:7px}
  .recs li{display:flex;gap:8px;align-items:baseline;font-size:12.5px}
  .recs .tag{flex:none}
  .badge{display:inline-block;border-radius:5px;padding:1.5px 8px;font:700 10px var(--body);letter-spacing:.04em;text-transform:uppercase}
  .badge.b-good,.badge.b-flag{background:var(--pos-bg);color:var(--pos)}
  .badge.b-warn{background:var(--amb-bg);color:var(--amb)}
  .badge.b-neutral,.badge.b-bad{background:var(--line2);color:var(--mut)}
  .alert{border-radius:8px;padding:9px 13px;margin:6px 0;font-size:12.5px;border:1px solid var(--line)}
  .alert.crit{background:var(--neg-bg);border-color:#fecaca;color:#7f1d1d}
  .alert.warn{background:var(--amb-bg);border-color:#fde68a;color:#78350f}
  .alert.good{background:var(--pos-bg);border-color:#bbf7d0;color:#14532d}
  .pcard .phead{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .workstrip{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--ink)}
  .workstrip:hover{text-decoration:none;background:var(--soft)}
  .srarrow{margin-left:auto;color:var(--acc);flex:none}
  .backlink{display:inline-block;font:600 11px var(--body);letter-spacing:.04em;text-transform:uppercase;
    color:var(--mut);text-decoration:none;margin-bottom:10px}
  .backlink:hover{color:var(--acc);text-decoration:none}
  .extlink{display:inline-flex;color:var(--acc);margin-left:6px;font-size:12px}
  .extlink .ic{width:12px;height:12px}
  .lcl{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:7px;font-size:12.5px}
  .miles .mile{display:flex;gap:10px;padding:6px 0;font-size:12.5px}
  .miledate{font:600 10.5px var(--body);color:var(--mut);min-width:48px}
  .rolehead{display:flex;align-items:center;gap:12px;margin:22px 0 10px;padding:11px 15px;background:#fff;
    border:1px solid var(--line);border-radius:10px}
  .rolehead h2{font-size:13.5px}
  .roleemoji{font-size:18px}.rolesub{font-size:11px;color:var(--mut)}
  .rolecount{margin-left:auto;background:var(--line2);color:var(--mut);font:600 11px var(--body);padding:3px 10px;border-radius:999px}
  .chglist{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
  .board{display:grid;grid-template-columns:repeat(12,1fr);gap:12px;margin:0 0 16px}
  .t3{grid-column:span 3}.t4{grid-column:span 4}.t6{grid-column:span 6}.t12{grid-column:span 12}
  .tile{display:flex;flex-direction:column;gap:2px}
  .kpiL{font:600 10px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
