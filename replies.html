<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Support Replies</title>

<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#161310">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Replies">

<link rel="apple-touch-icon" href="/replies-icon-192.png">

<style>
  :root{color-scheme:dark;
    --bg:#161310;--surf:#211d17;--card:#262019;--card2:#2f281f;--line:#3a3228;--line2:#2c261e;
    --ink:#f4efe6;--ink2:#cabfad;--ink3:#93897a;
    --acc:#e08a68;--acc2:#cc785c;--accsoft:#3a271e;
    --up:#6ea86f;--upsoft:#213026;--red:#e0715c;--amber:#d6ab55;
    --r:16px;--rs:12px;--rp:999px}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
    -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
  body{padding-bottom:calc(90px + env(safe-area-inset-bottom))}
  button,input,textarea,select{font:inherit;color:inherit}
  a{color:var(--acc);text-decoration:none}

  /* ---- sticky header ---- */
  .top{position:sticky;top:0;z-index:20;background:rgba(22,19,16,.92);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 12px 8px}
  .toprow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px}
  .brand .dot{width:22px;height:22px;border-radius:7px;background:var(--acc);flex:none;
    display:flex;align-items:center;justify-content:center}
  .brand .dot svg{width:14px;height:14px;stroke:#161310;fill:none;stroke-width:2.4}
  .seg{display:inline-flex;background:var(--surf);border:1px solid var(--line);border-radius:var(--rp);padding:2px}
  .seg button{background:none;border:0;color:var(--ink3);font-weight:700;font-size:13px;
    padding:7px 13px;border-radius:var(--rp);min-height:34px}
  .seg button.on{background:var(--acc);color:#161310}
  .iconbtn{margin-left:auto;background:var(--surf);border:1px solid var(--line);color:var(--ink2);
    width:40px;height:40px;border-radius:var(--rs);display:flex;align-items:center;justify-content:center;flex:none}
  .iconbtn.on{background:var(--accsoft);border-color:var(--acc);color:var(--acc)}
  .iconbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .searchwrap{position:relative}
  .searchwrap svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:19px;height:19px;
    stroke:var(--ink3);fill:none;stroke-width:2;pointer-events:none}
  #q{width:100%;background:var(--surf);border:1px solid var(--line);border-radius:var(--rs);
    padding:13px 40px 13px 40px;font-size:16px;min-height:48px}
  #q:focus{outline:none;border-color:var(--acc)}
  .clearq{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;
    color:var(--ink3);width:34px;height:34px;font-size:20px;display:none}
  .clearq.show{display:block}
  .chips{display:flex;gap:7px;overflow-x:auto;margin-top:8px;padding-bottom:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;background:var(--surf);border:1px solid var(--line);color:var(--ink2);
    padding:7px 13px;border-radius:var(--rp);font-size:13.5px;font-weight:600;white-space:nowrap;min-height:34px}
  .chip.on{background:var(--acc);border-color:var(--acc);color:#161310}

  /* ---- content ---- */
  .wrap{max-width:640px;margin:0 auto;padding:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
  .chead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .ctitle{font-weight:700;font-size:15.5px;flex:1;min-width:0}
  .ctag{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink3);
    background:var(--surf);border:1px solid var(--line);padding:2px 7px;border-radius:6px;white-space:nowrap}
  .pin{background:none;border:0;color:var(--ink3);width:32px;height:32px;font-size:18px;flex:none}
  .pin.on{color:var(--amber)}
  .body{white-space:pre-wrap;word-break:break-word;background:var(--surf);border:1px solid var(--line2);
    border-radius:var(--rs);padding:11px 12px;font-size:14.5px;line-height:1.5;color:var(--ink2);margin-bottom:10px}
  .body .ph{color:var(--acc);background:var(--accsoft);border-radius:5px;padding:0 3px;font-weight:600}
  .vars{display:grid;gap:8px;margin-bottom:10px}
  .var label{display:block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);margin-bottom:3px}
  .var input{width:100%;background:var(--surf);border:1px solid var(--line);border-radius:var(--rs);padding:11px 12px;font-size:16px;min-height:46px}
  .var input:focus{outline:none;border-color:var(--acc)}
  .copybtn{width:100%;min-height:52px;border:0;border-radius:var(--rs);background:var(--acc);color:#161310;
    font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}
  .copybtn:disabled{background:var(--surf);color:var(--ink3);border:1px solid var(--line)}
  .copybtn.ok{background:var(--up);color:#fff}
  .copybtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2.2}
  .miss{font-size:12.5px;color:var(--amber);margin-top:7px;text-align:center}
  .rowbtns{display:flex;gap:8px;margin-top:10px}
  .rowbtns button{flex:1;min-height:44px;background:var(--surf);border:1px solid var(--line);color:var(--ink2);
    border-radius:var(--rs);font-weight:600;font-size:14px}
  .rowbtns .del{color:var(--red);border-color:#4a2b25}
  .empty{text-align:center;color:var(--ink3);padding:50px 20px;font-size:15px}

  /* ---- tools (credential parser + payment) ---- */
  .tool{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--acc);border-radius:var(--r);padding:14px;margin-bottom:14px}
  .tool h3{margin:0 0 4px;font-size:15px;display:flex;align-items:center;gap:7px}
  .tool .hint{font-size:12.5px;color:var(--ink3);margin-bottom:10px}
  .tool textarea{width:100%;min-height:96px;background:var(--surf);border:1px solid var(--line);border-radius:var(--rs);
    padding:11px 12px;font-size:14px;font-family:ui-monospace,Menlo,monospace;resize:vertical}
  .tool textarea:focus{outline:none;border-color:var(--acc)}
  .tool select{width:100%;background:var(--surf);border:1px solid var(--line);border-radius:var(--rs);padding:12px;min-height:48px;font-size:16px;-webkit-appearance:none;appearance:none}
  .warn{background:#3a201b;border:1px solid var(--red);color:#f0b4a8;border-radius:var(--rs);padding:9px 11px;font-size:13px;margin:10px 0;font-weight:600}
  .okline{color:var(--up);font-size:12.5px;margin:8px 0}

  /* ---- FAB / toast / auth ---- */
  .fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;
    background:var(--acc);color:#161310;border:0;font-size:30px;box-shadow:0 6px 20px rgba(0,0,0,.5);z-index:15;display:none}
  .fab.show{display:block}
  .toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(24px + env(safe-area-inset-bottom));
    background:var(--up);color:#fff;font-weight:700;padding:12px 20px;border-radius:var(--rp);opacity:0;pointer-events:none;
    transition:.22s;z-index:40;box-shadow:0 6px 20px rgba(0,0,0,.5)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .overlay.on{display:flex}
  .sheet{background:var(--card);border:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:640px;
    max-height:92vh;overflow:auto;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
  .sheet h2{margin:0 0 14px;font-size:19px;display:flex;justify-content:space-between;align-items:center}
  .sheet .x{background:none;border:0;color:var(--ink3);font-size:24px;width:36px;height:36px}
  .fld{margin-bottom:12px}
  .fld label{display:block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);margin-bottom:5px}
  .fld input,.fld textarea,.fld select{width:100%;background:var(--surf);border:1px solid var(--line);border-radius:var(--rs);padding:11px 12px;font-size:16px}
  .fld textarea{min-height:120px;font-family:ui-monospace,Menlo,monospace;font-size:14px;resize:vertical}
  .fld input:focus,.fld textarea:focus,.fld select:focus{outline:none;border-color:var(--acc)}
  .langtabs{display:flex;gap:6px;margin-bottom:10px}
  .langtabs button{flex:1;background:var(--surf);border:1px solid var(--line);color:var(--ink3);border-radius:var(--rs);padding:9px;font-weight:700;min-height:42px}
  .langtabs button.on{background:var(--accsoft);border-color:var(--acc);color:var(--acc)}
  .btn{min-height:50px;border-radius:var(--rs);font-weight:800;font-size:16px;border:1px solid var(--line);background:var(--surf);color:var(--ink);width:100%}
  .btn.primary{background:var(--acc);color:#161310;border:0}
  .btn.danger{color:var(--red);border-color:#4a2b25}

  .authgate{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;padding:24px;z-index:100}
  .authgate.on{display:flex}
  .authcard{width:100%;max-width:340px;display:flex;flex-direction:column;gap:11px;text-align:center}
  .authcard h1{font-size:24px;margin:0}
  .authcard p{color:var(--ink3);font-size:13.5px;margin:0 0 4px}
  .authcard input{background:var(--surf);border:1px solid var(--line);border-radius:var(--rs);padding:13px;font-size:16px;min-height:50px}
  .authcard .btn{margin-top:2px}
  .err{color:var(--red);font-size:13px;min-height:16px}
</style>
</head>
<body>

<div id="authGate" class="authgate on">
  <form class="authcard" id="authForm">
    <h1>Support Replies</h1>
    <p>Sign in with your dashboard account.</p>
    <input id="authEmail" type="email" placeholder="Email" autocomplete="username">
    <input id="authPass" type="password" placeholder="Password" autocomplete="current-password">
    <div class="err" id="authErr"></div>
    <button class="btn primary" id="signInBtn" type="submit">Sign in</button>
  </form>
</div>

<div class="top">
  <div class="toprow">
    <div class="brand"><span class="dot"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H8l-4 4V5a2 2 0 0 1 2-2h13a2 2 0 0 1 2 2z"/></svg></span>Replies</div>
    <div class="seg" id="langSeg">
      <button data-lang="es" class="on">ES</button><button data-lang="fr">FR</button><button data-lang="nl">NL</button>
    </div>
    <button class="iconbtn" id="editToggle" title="Edit mode"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
  </div>
  <div class="searchwrap">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="q" type="search" enterkeyhint="search" autocomplete="off" placeholder="Paste what the client wrote…">
    <button class="clearq" id="clearq" aria-label="clear">×</button>
  </div>
  <div class="chips" id="chips"></div>
</div>

<div class="wrap">
  <div id="tools"></div>
  <div id="list"></div>
</div>

<button class="fab" id="addFab" title="Add reply">+</button>
<div class="toast" id="toast">Copied</div>

<!-- Edit sheet -->
<div class="overlay" id="editOv">
  <div class="sheet">
    <h2><span id="editTitle">New reply</span><button class="x" id="editClose">×</button></h2>
    <div class="fld"><label>Category</label><select id="eCat"></select></div>
    <div class="langtabs" id="eLangTabs">
      <button data-l="es" class="on">Español</button><button data-l="fr">Français</button><button data-l="nl">Nederlands</button>
    </div>
    <div class="fld"><label>Title</label><input id="eTitle" placeholder="Short title"></div>
    <div class="fld"><label>Body <span style="text-transform:none;color:var(--ink3)">— use {USER} {PASS} {HOST} {SERVER} for fill-in fields</span></label><textarea id="eBody"></textarea></div>
    <div class="fld"><label>Keywords <span style="text-transform:none;color:var(--ink3)">— words clients use, comma separated</span></label><textarea id="eKw" style="min-height:70px"></textarea></div>
    <button class="btn primary" id="eSave" style="margin-bottom:10px">Save</button>
    <button class="btn danger" id="eDelete">Delete this reply</button>
  </div>
</div>

 {id:5,key:"which_app",cat:"install",pin:false,use:0,

// ---------- helpers ----------
function norm(s){return (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");}
function esc(s){return String(s==null?"":s).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
function tokens(body){var m=(body||"").match(/\{([A-Z_]+)\}/g)||[];var seen=[],out=[];m.forEach(function(t){var k=t.slice(1,-1);if(seen.indexOf(k)<0){seen.push(k);out.push(k);}});return out;}
function fill(body){return (body||"").replace(/\{([A-Z_]+)\}/g,function(_,k){return (VARS[k]!=null&&VARS[k]!=="")?VARS[k]:("{"+k+"}");});}
function ready(body){return tokens(body).every(function(k){return VARS[k]!=null&&VARS[k]!=="";});}
function stripEmoji(s){return (s||"").replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2190}-\u{21FF}\u{2B00}-\u{2BFF}\uFE0F\u200D]/gu,"");}

// ---------- search scoring ----------
function score(r){
  if(!query)return 1;
  var qn=norm(query), words=qn.split(/\s+/).filter(function(w){return w.length>1;});
  var kw=norm(r.kw&&r.kw[lang]||""), ti=norm(r.title&&r.title[lang]||""), bo=norm(r.body&&r.body[lang]||"");
  var s=0;
  if(kw.indexOf(qn)>=0)s+=60; if(ti.indexOf(qn)>=0)s+=45; if(bo.indexOf(qn)>=0)s+=12;
  words.forEach(function(w){ if(kw.indexOf(w)>=0)s+=9; if(ti.indexOf(w)>=0)s+=6; if(bo.indexOf(w)>=0)s+=2; });
  return s;
}

  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,function(){legacy(txt);done();});}
  else {legacy(txt);done();}
}

// ---------- credential parser tool ----------
function credToolHTML(){
  return '<div class="tool"><h3>'+(lang==="fr"?"Coller les identifiants du panneau":lang==="nl"?"Panelgegevens plakken":"Pegar credenciales del panel")+'</h3>'+
    '<div class="hint">'+(lang==="fr"?"Collez la sortie du panneau ou une URL m3u. Le message de test se construit tout seul.":lang==="nl"?"Plak de panel-uitvoer of een m3u-URL. Het testbericht wordt vanzelf opgebouwd.":"Pega la salida del panel o una URL m3u. El mensaje de prueba se arma solo.")+'</div>'+
    '<textarea id="credIn" placeholder="Username: 7EG13381&#10;Password: J47HT2PS&#10;DNS (URL): http://...msostvip.com&#10;Samsung & LG DNS: http://...msgssmart.com"></textarea>'+
    '<div id="credOut"></div></div>';
}
function parseCreds(raw){
  raw=stripEmoji(raw||"");
  var user="",pass="",host="",fam="";
  var m3u=raw.match(/https?:\/\/([^\/\s]+)\/get\.php\?([^\s]+)/i);
  if(m3u){
    host=m3u[1];
    var qs=m3u[2];
    var mu=qs.match(/username=([^&\s]+)/i); if(mu)user=decodeURIComponent(mu[1]);
    var mp=qs.match(/password=([^&\s]+)/i); if(mp)pass=decodeURIComponent(mp[1]);
  } else {
    var mu2=raw.match(/user(?:name)?\s*[:=]\s*([^\s]+)/i); if(mu2)user=mu2[1];
    var mp2=raw.match(/pass(?:word)?\s*[:=]\s*([^\s]+)/i); if(mp2)pass=mp2[1];
  }
  // collect all hosts present
  var hosts=[]; var hre=/https?:\/\/([^\/\s]+)/gi, hm;
  while((hm=hre.exec(raw))){ if(hosts.indexOf(hm[1])<0)hosts.push(hm[1]); }
  if(host&&hosts.indexOf(host)<0)hosts.push(host);
  var mega=hosts.filter(function(h){return /msostvip\.com|msgssmart\.com/i.test(h);});
  var dino=hosts.some(function(h){return /line\.dndnscloud\.ru/i.test(h);}) || /dndnscloud/i.test(host);
  if(mega.length){ fam="mega"; var sub=mega[0].replace(/\.(msostvip|msgssmart)\.com.*/i,""); host=sub; }
  else if(dino){ fam="dino"; host="line.dndnscloud.ru"; }
  else if(host){ fam="generic"; }
  return {user:user,pass:pass,host:host,fam:fam,hasData:!!(user||pass||host)};
}
function credMessage(p){
  if(p.fam==="mega"){ var r=REPLIES.find(function(x){return x.key==="trial_mega";})||SEED[0];
    return (r.body[lang]||r.body.es).replace(/\{HOST\}/g,p.host||"{HOST}").replace(/\{USER\}/g,p.user||"{USER}").replace(/\{PASS\}/g,p.pass||"{PASS}"); }
  if(p.fam==="dino"){ var r2=REPLIES.find(function(x){return x.key==="trial_dino";})||SEED[1];
    return (r2.body[lang]||r2.body.es).replace(/\{USER\}/g,p.user||"{USER}").replace(/\{PASS\}/g,p.pass||"{PASS}"); }
  // generic
  var head={es:"Aquí tienes la prueba de 24 horas:",fr:"Voici votre test de 24 heures :",nl:"Hier is je test van 24 uur:"}[lang];
  var ul={es:"Usuario",fr:"Utilisateur",nl:"Gebruikersnaam"}[lang], pl={es:"Contraseña",fr:"Mot de passe",nl:"Wachtwoord"}[lang], sl={es:"Servidor",fr:"Serveur",nl:"Server"}[lang];
  var tail={es:"Entra con «Xtream Codes API» y pon solo esa dirección, sin nada detrás.\n\nSon 24 horas desde ahora. Cualquier cosa me dices.",
    fr:"Connectez-vous avec « Xtream Codes API » et mettez uniquement cette adresse, rien derrière.\n\nC'est 24 heures à partir de maintenant.",
    nl:"Log in met «Xtream Codes API» en vul alleen dat adres in, zonder iets erachter.\n\nHet loopt 24 uur vanaf nu."}[lang];
  return head+"\n\n"+sl+": http://"+(p.host||"{HOST}")+"\n"+ul+": "+(p.user||"{USER}")+"\n"+pl+": "+(p.pass||"{PASS}")+"\n\n"+tail;
}
function wireCredTool(){
  var inp=$("#credIn"); if(!inp)return;
  var run=function(){
    var p=parseCreds(inp.value);
    var out=$("#credOut");
    if(!p.hasData){ out.innerHTML=""; return; }
    var msg=credMessage(p);
    var famLbl=p.fam==="mega"?"mega":p.fam==="dino"?"dino":(lang==="fr"?"générique":lang==="nl"?"algemeen":"genérico");
    var complete=msg.indexOf("{")<0;
    out.innerHTML='<div class="okline">'+(lang==="fr"?"Serveur ":lang==="nl"?"Server ":"Servidor ")+famLbl+' · '+(p.user?"✓ user":"user?")+' · '+(p.pass?"✓ pass":"pass?")+'</div>'+
      '<div class="body" style="margin-top:8px">'+esc(msg)+'</div>'+
      '<button class="copybtn" id="credCopy"'+(complete?"":" disabled")+'><svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>'+(lang==="fr"?"Copier le message":lang==="nl"?"Bericht kopiëren":"Copiar mensaje")+'</button>'+
      (complete?"":'<div class="miss">'+(lang==="fr"?"Il manque des données dans ce que vous avez collé.":lang==="nl"?"Er ontbreken gegevens in wat je plakte.":"Faltan datos en lo que has pegado.")+'</div>');
    var cb=$("#credCopy"); if(cb&&complete)cb.onclick=function(){copyText(msg,cb);};
  };
  inp.oninput=run; run();
}

// ---------- payment tool ----------
function payToolHTML(){
  var opts=PAYPLANS.map(function(p){return '<option value="'+p.id+'">'+PLANLBL[lang](p.months)+' — '+p.price+' €</option>';}).join("");
  return '<div class="tool"><h3>'+(lang==="fr"?"Lien de paiement":lang==="nl"?"Betaallink":"Enlace de pago")+'</h3>'+
    '<select id="paySel"><option value="">'+(lang==="fr"?"Choisir un plan…":lang==="nl"?"Kies een plan…":"Elige un plan…")+'</option>'+opts+'<option value="custom">'+(lang==="fr"?"Montant libre…":lang==="nl"?"Vrij bedrag…":"Importe libre…")+'</option></select>'+
    '<div id="payOut"></div></div>';
}
function payMessage(link){ var r=REPLIES.find(function(x){return x.key==="payment";})||SEED[12]; return (r.body[lang]||r.body.es)+"\n\n"+PAYLEAD[lang]+"\n"+link; }
function wirePayTool(){
  var sel=$("#paySel"); if(!sel)return;
  sel.onchange=function(){
    var out=$("#payOut"), v=sel.value;
    if(!v){out.innerHTML="";return;}
    if(v==="custom"){
      out.innerHTML='<div class="fld" style="margin-top:10px"><label>'+(lang==="fr"?"Montant (€)":lang==="nl"?"Bedrag (€)":"Importe (€)")+'</label><input id="payAmt" type="number" inputmode="decimal" placeholder="0"></div>'+
        '<div class="fld"><label>'+(lang==="fr"?"Lien de paiement":lang==="nl"?"Betaallink":"Enlace de pago")+'</label><input id="payLink" placeholder="https://..."></div><div id="payRes"></div>';
      var upd=function(){ var lk=($("#payLink").value||"").trim(); var res=$("#payRes"); if(!lk){res.innerHTML='<div class="miss">'+(lang==="fr"?"Collez le lien.":lang==="nl"?"Plak de link.":"Pega el enlace.")+'</div>';return;} var msg=payMessage(lk); res.innerHTML=payBody(msg,lk); wirePayCopy(msg); };
      $("#payAmt").oninput=upd; $("#payLink").oninput=upd; return;
    }
    var p=PAYPLANS.find(function(x){return String(x.id)===v;}); if(!p){out.innerHTML="";return;}
    var warn="";
    if(!p.link){ warn='<div class="warn">'+(lang==="fr"?"Aucun lien enregistré pour ce plan. Ajoutez-le en mode édition (crayon).":lang==="nl"?"Geen link opgeslagen voor dit plan. Voeg toe in bewerkmodus (potlood).":"No hay enlace guardado para este plan. Añádelo en modo edición (lápiz).")+'</div>'; }
    else if(p.amount!=null&&Number(p.amount)!==Number(p.price)){ warn='<div class="warn">⚠ '+(lang==="fr"?"Le lien encaisse "+p.amount+" € mais le plan est à "+p.price+" €. Vérifiez avant d'envoyer.":lang==="nl"?"De link int "+p.amount+" € maar het plan is "+p.price+" €. Controleer voor je verstuurt.":"El enlace cobra "+p.amount+" € pero el plan es de "+p.price+" €. Revisa antes de enviar.")+'</div>'; }
    if(!p.link){ out.innerHTML=warn+editLinkRow(p); wireLinkRow(p); return; }
    var msg=payMessage(p.link);
    out.innerHTML=warn+payBody(msg,p.link)+(editMode?editLinkRow(p):"");
    wirePayCopy(msg); if(editMode)wireLinkRow(p);
  };
}
function payBody(msg,link){ return '<div class="body" style="margin-top:10px">'+esc(msg)+'</div><button class="copybtn" id="payCopy"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>'+(lang==="fr"?"Copier":lang==="nl"?"Kopiëren":"Copiar")+'</button>'; }
function wirePayCopy(msg){ var b=$("#payCopy"); if(b)b.onclick=function(){copyText(msg,b);}; }
function editLinkRow(p){ return '<div class="fld" style="margin-top:12px"><label>'+(lang==="fr"?"Lien de ce plan":lang==="nl"?"Link van dit plan":"Enlace de este plan")+'</label><input id="plLink" value="'+esc(p.link||"")+'" placeholder="https://..."></div>'+
  '<div class="fld"><label>'+(lang==="fr"?"Montant du lien (€)":lang==="nl"?"Bedrag van de link (€)":"Importe del enlace (€)")+'</label><input id="plAmt" type="number" inputmode="decimal" value="'+(p.amount!=null?p.amount:"")+'" placeholder="'+p.price+'"></div>'+
  '<button class="btn" id="plSave">'+(lang==="fr"?"Enregistrer le lien":lang==="nl"?"Link opslaan":"Guardar enlace")+'</button>'; }
function wireLinkRow(p){ var b=$("#plSave"); if(!b)return; b.onclick=function(){ p.link=($("#plLink").value||"").trim(); var a=$("#plAmt").value; p.amount=a===""?null:Number(a); persist(); toast(lang==="fr"?"Enregistré":lang==="nl"?"Opgeslagen":"Guardado"); $("#paySel").dispatchEvent(new Event("change")); }; }

// ---------- events ----------
$("#langSeg").onclick=function(e){var b=e.target.closest("[data-lang]");if(!b)return;lang=b.getAttribute("data-lang");localStorage.setItem(LS_LANG,lang);[].forEach.call(this.children,function(c){c.classList.toggle("on",c===b);});document.documentElement.lang=lang;render();};
$("#chips").onclick=function(e){var b=e.target.closest("[data-cat]");if(!b)return;cat=b.getAttribute("data-cat");render();window.scrollTo(0,0);};
$("#q").oninput=function(){query=this.value;$("#clearq").classList.toggle("show",!!query);renderList();};
$("#clearq").onclick=function(){query="";$("#q").value="";this.classList.remove("show");renderList();$("#q").focus();};
$("#editToggle").onclick=function(){editMode=!editMode;this.classList.toggle("on",editMode);$("#addFab").classList.toggle("show",editMode);render();};

$("#list").addEventListener("input",function(e){var i=e.target.closest("[data-vk]");if(!i)return;var k=i.getAttribute("data-vk");VARS[k]=i.value;sessionStorage.setItem(LS_VARS,JSON.stringify(VARS));
  // update all cards sharing this var without losing focus: refresh previews + copy state
  refreshVars();
});
function refreshVars(){
  [].forEach.call(document.querySelectorAll("#list [data-card]"),function(card){
    var id=Number(card.getAttribute("data-card")); var r=REPLIES.find(function(x){return x.id===id;}); if(!r)return;
    var body=r.body[lang]||""; var bd=card.querySelector(".body"); if(bd)bd.innerHTML=bodyPreviewHTML(body);
    var ok=ready(body), cb=card.querySelector(".copybtn"); if(cb)cb.disabled=!ok;
    var miss=tokens(body).filter(function(k){return !(VARS[k]!=null&&VARS[k]!=="");});
    var mm=card.querySelector(".miss");
    var txt=miss.length?((lang==="fr"?"À remplir : ":lang==="nl"?"Nog invullen: ":"Rellena: ")+miss.map(vlabel).join(", ")):"";
    if(mm)mm.textContent=txt;
  });
}
$("#list").addEventListener("click",function(e){
  var c=e.target.closest("[data-copy]"); if(c){var r=REPLIES.find(function(x){return x.id===Number(c.getAttribute("data-copy"));}); if(r&&ready(r.body[lang]||"")){copyText(fill(r.body[lang]||""),c); r.use=(r.use||0)+1; persist();} return;}
  var p=e.target.closest("[data-pin]"); if(p){var r2=REPLIES.find(function(x){return x.id===Number(p.getAttribute("data-pin"));}); if(r2){r2.pin=!r2.pin;persist();renderList();} return;}
  var ed=e.target.closest("[data-edit]"); if(ed){openEdit(Number(ed.getAttribute("data-edit"))); return;}
});

// ---------- edit sheet ----------
var eOv=$("#editOv");
$("#eCat").innerHTML=CATS.map(function(c){return '<option value="'+c.id+'">'+esc(c.es)+'</option>';}).join("");
function openAdd(){ editId=null; editLang="es"; $("#editTitle").textContent="New reply"; $("#eCat").value="other"; setLangTab(); $("#eDelete").style.display="none"; loadEditFields({title:{},body:{},kw:{}}); eOv.classList.add("on"); }
function openEdit(id){ var r=REPLIES.find(function(x){return x.id===id;}); if(!r)return; editId=id; editLang=lang; $("#editTitle").textContent="Edit"; $("#eCat").value=r.cat; $("#eDelete").style.display=""; loadEditFields(r); setLangTab(); eOv.classList.add("on"); }
var editData={title:{},body:{},kw:{}};
function loadEditFields(r){ editData={title:Object.assign({},r.title),body:Object.assign({},r.body),kw:Object.assign({},r.kw)}; showLang(); }
function showLang(){ $("#eTitle").value=editData.title[editLang]||""; $("#eBody").value=editData.body[editLang]||""; $("#eKw").value=editData.kw[editLang]||""; }
function stashLang(){ editData.title[editLang]=$("#eTitle").value; editData.body[editLang]=$("#eBody").value; editData.kw[editLang]=$("#eKw").value; }
function setLangTab(){ [].forEach.call($("#eLangTabs").children,function(b){b.classList.toggle("on",b.getAttribute("data-l")===editLang);}); }
$("#eLangTabs").onclick=function(e){var b=e.target.closest("[data-l]");if(!b)return;stashLang();editLang=b.getAttribute("data-l");setLangTab();showLang();};
$("#editClose").onclick=function(){eOv.classList.remove("on");};
eOv.onclick=function(e){if(e.target===eOv)eOv.classList.remove("on");};
$("#eSave").onclick=function(){ stashLang();
  var t=editData.title, b=editData.body, k=editData.kw, catv=$("#eCat").value;
  if(!(b.es||b.fr||b.nl)){ alert("Add a body."); return; }
  ["es","fr","nl"].forEach(function(L){ if(!t[L])t[L]=t.es||t.fr||t.nl||"(untitled)"; if(!b[L])b[L]=b.es||b.fr||b.nl||""; if(!k[L])k[L]=k.es||""; });
  if(editId==null){ var nid=REPLIES.reduce(function(m,x){return Math.max(m,x.id);},0)+1; REPLIES.push({id:nid,cat:catv,pin:false,use:0,title:t,body:b,kw:k}); }
  else { var r=REPLIES.find(function(x){return x.id===editId;}); if(r){r.cat=catv;r.title=t;r.body=b;r.kw=k;} }
  persist(); eOv.classList.remove("on"); render();
};
$("#eDelete").onclick=function(){ if(editId==null)return; if(!confirm("Delete this reply?"))return; REPLIES=REPLIES.filter(function(x){return x.id!==editId;}); persist(); eOv.classList.remove("on"); render(); };
$("#addFab").onclick=openAdd;

// ---------- auth + cloud ----------
$("#authForm").onsubmit=function(e){ e.preventDefault(); $("#authErr").textContent=""; signInWithEmailAndPassword(auth,$("#authEmail").value.trim(),$("#authPass").value).catch(function(err){ $("#authErr").textContent="Sign-in failed: "+((err&&err.code||"").replace("auth/","").replace(/-/g," ")); }); };
onAuthStateChanged(auth,function(user){
  if(user){ $("#authGate").classList.remove("on"); docRef=doc(db,"trackers",user.uid);
    if(unsub)unsub();
    unsub=onSnapshot(docRef,function(snap){ var d=snap.exists()?snap.data():null;
      if(d&&Array.isArray(d.replies)&&d.replies.length){ REPLIES=d.replies; PAYPLANS=Array.isArray(d.payplans)?d.payplans:clone(PAYSEED); }
      else if(!snap.exists()||!d.replies){ REPLIES=clone(SEED); PAYPLANS=clone(PAYSEED); persist(); }
      saveCache(); render();
    }, function(err){ console.error(err); });
  } else { if(unsub){unsub();unsub=null;} docRef=null; $("#authGate").classList.add("on"); }
});

// ---------- init (instant from cache) ----------
document.documentElement.lang=lang;
[].forEach.call($("#langSeg").children,function(c){c.classList.toggle("on",c.getAttribute("data-lang")===lang);});
loadCache(); render();

// ---------- PWA ----------
if("serviceWorker" in navigator){ window.addEventListener("load",function(){ navigator.serviceWorker.register("/replies-sw.js",{scope:"/replies"}).catch(function(){}); }); }
})();
</script>
